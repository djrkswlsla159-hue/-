<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a06">
  <title>가계부</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="prev" aria-label="이전 달">&lt;</button>
    <h1 id="monthLabel"></h1>
    <button id="next" aria-label="다음 달">&gt;</button>
  </header>

  <main>
    <section class="summary">
      <div><span>수입</span><strong id="sumIncome" class="income">0</strong></div>
      <div><span>지출</span><strong id="sumExpense" class="expense">0</strong></div>
      <div><span>잔액</span><strong id="sumBalance">0</strong></div>
    </section>

    <section class="card" id="statsCard" hidden>
      <h2>지출 카테고리</h2>
      <div id="stats"></div>
    </section>

    <section class="card">
      <h2>내역</h2>
      <div id="list"></div>
    </section>

    <div class="tools">
      <button id="exportBtn" class="link">CSV 내보내기</button>
      <button id="importBtn" class="link">CSV 불러오기</button>
      <input id="importFile" type="file" accept=".csv,text/csv" hidden>
    </div>
  </main>

  <button id="fab" aria-label="내역 추가">+</button>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlgTitle">내역 추가</h2>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="type" value="expense" checked><span>지출</span></label>
        <label><input type="radio" name="type" value="income"><span>수입</span></label>
      </div>
      <label>금액
        <input name="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="0">
      </label>
      <label>카테고리
        <select name="category" required></select>
      </label>
      <label>날짜
        <input name="date" type="date" required>
      </label>
      <label>메모
        <input name="memo" type="text" maxlength="60" placeholder="선택">
      </label>
      <div class="actions">
        <button type="button" id="delBtn" class="danger" hidden>삭제</button>
        <button type="button" id="cancelBtn">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
